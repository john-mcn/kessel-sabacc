name: Mirror deployment branch

on:
  push:
    branches:
      - deployment

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for full history

      - name: Push deployment -> main
        run: |
          git remote add deploy https://x-access-token:${{ secrets.DEPLOY_KEY }}@github.com/johnm-portfolio/sabacc-deployment.git
          git push --force deploy deployment:main
